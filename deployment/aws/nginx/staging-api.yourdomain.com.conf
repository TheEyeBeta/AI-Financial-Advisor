# Nginx server block for the staging backend. Same as api.yourdomain.com.conf
# but proxies to the staging container's port (8002).

server {
    listen 80;
    server_name staging-api.yourdomain.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name staging-api.yourdomain.com;

    # ssl_certificate / ssl_certificate_key are added here by certbot.

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
