# Nginx server block for the prod backend. Install to
# /etc/nginx/sites-available/api.yourdomain.com.conf on the Oracle VM,
# symlink into sites-enabled, replace api.yourdomain.com with your real
# domain, then run certbot (see ../README.md) which rewrites the
# ssl_certificate lines below automatically.

server {
    listen 80;
    server_name api.yourdomain.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # ssl_certificate / ssl_certificate_key are added here by certbot.

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (chat endpoints)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
