name: Lint & Type Check

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint (zero warnings)
        run: npm run lint:ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Check for excessive lint-disable comments
        run: |
          count=$(grep -R "eslint-disable" src/ --include="*.ts" --include="*.tsx" | wc -l)
          echo "Found $count eslint-disable comments"
          if [ "$count" -gt 10 ]; then
            echo "::error::Too many eslint-disable comments ($count). Review and justify each one."
            grep -Rn "eslint-disable" src/ --include="*.ts" --include="*.tsx"
            exit 1
          fi
