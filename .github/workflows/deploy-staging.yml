name: Deploy Staging (AWS, on-demand)

# Staging runs on an EC2 instance that is normally STOPPED to avoid billing
# for idle compute — it has no static IP, so it can't be wired to a fixed
# STAGING_BACKEND_URL secret or to Vercel's build-time VITE_PYTHON_API_URL
# the way Railway's staging was. This workflow is manual-trigger only: it
# starts the instance, deploys, health-checks the backend it just started
# (using the IP discovered in this same run), and always stops the
# instance again afterward regardless of outcome.
#
# Full frontend E2E against staging requires the Vercel staging/preview
# environment's VITE_PYTHON_API_URL to point at the IP this run prints —
# update that in Vercel manually (or via `vercel env`) and redeploy the
# staging frontend before setting run_e2e: true, or the E2E job will hit a
# frontend still pointed at a stale/previous backend.

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Run the Playwright E2E suite after deploy (requires staging_frontend_url to already point at this run'"'"'s backend)'
        type: boolean
        default: false
      staging_frontend_url:
        description: 'Staging frontend URL to test against (only used if run_e2e is true)'
        type: string
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'
  STAGING_INSTANCE_ID: 'i-09cb8ab036f055e7e'

jobs:
  deploy:
    name: Start, deploy, and health-check staging
    runs-on: ubuntu-latest
    environment:
      name: staging
    permissions:
      contents: read
    outputs:
      backend_url: ${{ steps.wait_ip.outputs.backend_url }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start staging instance
        run: aws ec2 start-instances --instance-ids "$STAGING_INSTANCE_ID"

      - name: Wait for instance to be running and reachable
        id: wait_ip
        run: |
          aws ec2 wait instance-running --instance-ids "$STAGING_INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$STAGING_INSTANCE_ID"
          IP=$(aws ec2 describe-instances --instance-ids "$STAGING_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Staging IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "backend_url=http://$IP:8002" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ steps.wait_ip.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.AWS_STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/ai-financial-advisor
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            cd deployment/aws
            docker compose -p afa-staging --env-file .env.staging \
              -f docker-compose.aws.yml up -d --build

      - name: Wait for backend health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ steps.wait_ip.outputs.backend_url }}/health/live" >/dev/null; then
              echo "Staging backend healthy at ${{ steps.wait_ip.outputs.backend_url }}"
              exit 0
            fi
            sleep 10
          done
          echo "Staging backend health check failed." >&2
          exit 1

      - name: Print next steps for full E2E
        if: inputs.run_e2e != true
        run: |
          echo "Staging backend is up at ${{ steps.wait_ip.outputs.backend_url }}"
          echo "To run frontend E2E against it: point the Vercel staging"
          echo "environment's VITE_PYTHON_API_URL / VITE_WEBSEARCH_API_URL at"
          echo "this URL, redeploy the staging frontend, then re-run this"
          echo "workflow with run_e2e=true and staging_frontend_url set."

  e2e:
    name: Run Full E2E Suite
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.run_e2e == true
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E suite against staging
        id: e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.staging_frontend_url }}
        run: |
          npx playwright test --reporter=json > "$RUNNER_TEMP/playwright-staging-results.json"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-playwright-report
          path: ${{ runner.temp }}/playwright-staging-results.json
          retention-days: 7

  stop:
    name: Stop staging instance
    runs-on: ubuntu-latest
    needs: [deploy, e2e]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop staging instance
        run: |
          aws ec2 stop-instances --instance-ids "$STAGING_INSTANCE_ID"
          echo "Staging instance stopping — no further compute billing until next run."
