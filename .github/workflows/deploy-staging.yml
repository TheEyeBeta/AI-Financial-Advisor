name: Deploy Staging (AWS, on-demand)

# Staging runs on an EC2 instance that is normally STOPPED to avoid billing
# for idle compute — it has no static IP, so it can't be wired to a fixed
# STAGING_BACKEND_URL secret or to Vercel's build-time VITE_PYTHON_API_URL
# the way Railway's staging was. This workflow is manual-trigger only: it
# starts the instance, deploys, health-checks the backend it just started
# (using the IP discovered in this same run), and always stops the
# instance again afterward regardless of outcome.
#
# When run_e2e is true, the "deploy" job automatically points a fresh
# Vercel preview deployment (built from the staging branch) at this run's
# backend before the E2E job runs — no manual Vercel step needed.

on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run the Playwright E2E suite after deploy (auto-provisions a Vercel preview pointed at this run's backend, unless staging_frontend_url is set)"
        type: boolean
        default: false
      staging_frontend_url:
        description: 'Optional: skip auto-provisioning and test against this frontend URL instead (only used if run_e2e is true)'
        type: string
        default: ''

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  AWS_REGION: 'us-east-1'
  STAGING_INSTANCE_ID: 'i-09cb8ab036f055e7e'
  STAGING_SECURITY_GROUP_ID: 'sg-0c81a063d376b31d0'

jobs:
  deploy:
    name: Start, deploy, and health-check staging
    runs-on: ubuntu-latest
    environment:
      # Matches "main-staging", the established GitHub Environment name
      # used by run-db-migrations.yml/staging-seed.yml for this org's
      # staging secrets/protection rules — not a bare "staging", which
      # would be created fresh with none of those rules attached.
      name: main-staging
    permissions:
      contents: read
    outputs:
      backend_url: ${{ steps.wait_ip.outputs.backend_url }}
      frontend_url: ${{ steps.vercel_preview.outputs.frontend_url }}

    steps:
      - name: Checkout staging branch
        # Needed for the Vercel preview deploy step further down, which
        # builds this checkout — not whatever ref workflow_dispatch ran on.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: staging
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start staging instance
        run: aws ec2 start-instances --instance-ids "$STAGING_INSTANCE_ID"

      - name: Wait for instance to be running and reachable
        id: wait_ip
        run: |
          aws ec2 wait instance-running --instance-ids "$STAGING_INSTANCE_ID"
          aws ec2 wait instance-status-ok --instance-ids "$STAGING_INSTANCE_ID"
          IP=$(aws ec2 describe-instances --instance-ids "$STAGING_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Staging IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "backend_url=http://$IP:8002" >> "$GITHUB_OUTPUT"

      - name: Authorize this runner's IP for SSH
        # The security group only allows SSH from the IP that provisioned
        # it (see deployment/aws/README.md) — GitHub-hosted runners get a
        # different, changing egress IP on every run, so the SSH step
        # below would time out without this. Revoked again in the always()
        # cleanup step further down, regardless of outcome.
        id: runner_ip
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "$STAGING_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "$IP/32"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ steps.wait_ip.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.AWS_STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/ai-financial-advisor
            git fetch origin staging
            git checkout staging
            git reset --hard origin/staging
            # Resolve GIT_SHA from the commit actually checked out above, not
            # github.sha — workflow_dispatch defaults to whatever ref an
            # operator ran this on (commonly main), but the box always
            # deploys origin/staging regardless. Trusting github.sha here
            # would report a commit the backend isn't running, and
            # release-verification.yml's workflow_run trigger only fires
            # when head_branch == 'staging'.
            GIT_SHA="$(git rev-parse HEAD)"
            cd deployment/aws
            GIT_SHA="$GIT_SHA" docker compose -p afa-staging --env-file .env.staging \
              -f docker-compose.aws.yml up -d --build

      - name: Wait for backend health
        # Curls localhost from inside the instance over SSH rather than
        # the public IP: BACKEND_BIND_ADDR defaults to 127.0.0.1 and port
        # 8002 is deliberately not opened in the security group (see the
        # no-TLS/no-domain tradeoff discussion in deployment/aws/README.md)
        # — a direct public curl would always time out.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ steps.wait_ip.outputs.ip }}
          username: ubuntu
          key: ${{ secrets.AWS_STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8002/health/live >/dev/null; then
                echo "Staging backend healthy."
                exit 0
              fi
              sleep 10
            done
            echo "Staging backend health check failed." >&2
            exit 1

      - name: Revoke this runner's IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$STAGING_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.runner_ip.outputs.ip }}/32" || true

      - name: Print backend URL
        if: inputs.run_e2e != true
        run: echo "Staging backend is up at ${{ steps.wait_ip.outputs.backend_url }}"

      - name: Point a Vercel preview at this run's backend and deploy it
        # KNOWN LIMITATION (Codex review, PR #328, 2026-09): backend_url is
        # http://<ephemeral-ip>:8002 — port 8002 is intentionally closed to
        # the public internet and not behind TLS (see README's no-TLS
        # tradeoff note). A browser loading this HTTPS Vercel preview will
        # block any *real* fetch to that URL as mixed content, and the
        # committed CSP doesn't allow a dynamic http:// origin either.
        # Playwright's own request mocking means the E2E suite below can
        # still pass without ever exercising a real network call to this
        # URL — a genuine staging backend integration check needs staging
        # behind its own HTTPS endpoint (e.g. a second Cloudflare Tunnel,
        # not yet built). Until then, treat a green run_e2e here as
        # "frontend behavior against mocked responses", not "AWS staging
        # backend verified reachable" — do not use it as promotion evidence
        # for real backend integration.
        if: inputs.run_e2e == true && inputs.staging_frontend_url == ''
        id: vercel_preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "::warning::run_e2e preview points VITE_PYTHON_API_URL at an http:// ephemeral IP that browsers will block as mixed content — Playwright's mocks paper over this, so this run does NOT prove real backend connectivity. See step comment for why."
          npx --yes vercel@latest link --yes --token="$VERCEL_TOKEN" --project ai-financial-advisor --scope the-eye-betas-projects
          npx --yes vercel@latest env rm VITE_PYTHON_API_URL preview --yes --token="$VERCEL_TOKEN" || true
          printf '%s' "${{ steps.wait_ip.outputs.backend_url }}" | \
            npx --yes vercel@latest env add VITE_PYTHON_API_URL preview --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(npx --yes vercel@latest deploy --token="$VERCEL_TOKEN" --yes)
          echo "frontend_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

  e2e:
    name: Run Full E2E Suite
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.run_e2e == true
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E suite against staging
        id: e2e
        env:
          # Manual override takes precedence if provided; otherwise use the
          # preview deployment the "deploy" job just pointed at this run's
          # backend.
          PLAYWRIGHT_BASE_URL: ${{ inputs.staging_frontend_url != '' && inputs.staging_frontend_url || needs.deploy.outputs.frontend_url }}
        run: |
          npx playwright test --reporter=json > "$RUNNER_TEMP/playwright-staging-results.json"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-playwright-report
          path: ${{ runner.temp }}/playwright-staging-results.json
          retention-days: 7

  stop:
    name: Stop staging instance
    runs-on: ubuntu-latest
    needs: [deploy, e2e]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop staging instance
        run: |
          aws ec2 stop-instances --instance-ids "$STAGING_INSTANCE_ID"
          echo "Staging instance stopping — no further compute billing until next run."
