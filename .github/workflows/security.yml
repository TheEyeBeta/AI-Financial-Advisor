name: Security Checks

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # SECURITY (#206): audit the COMMITTED lockfile exactly as it will be
      # deployed. Never run `npm audit fix` here — mutating the lockfile before
      # auditing hides the real state of the tree that ships.
      - name: Verify lockfile is unchanged by install
        run: git diff --exit-code package-lock.json
      - name: Audit production dependencies
        # --omit=optional keeps optional local tooling out of runtime dependency audits.
        run: npm audit --omit=dev --omit=optional --audit-level=high

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pip-audit and pip-tools
        run: python -m pip install --upgrade pip pip-audit pip-tools
      - name: Verify Python locks are current (#206)
        # Recompiling must be a no-op; fails when requirements.in changed
        # without regenerating the committed hashed locks.
        working-directory: backend/websearch_service
        run: |
          pip-compile --quiet --generate-hashes --output-file=requirements.txt requirements.in
          pip-compile --quiet --generate-hashes --output-file=requirements-dev.txt requirements-dev.in
          git diff --exit-code requirements.txt requirements-dev.txt
      - name: Audit backend runtime dependencies (pinned lock)
        # Audits the fully pinned lock actually installed in the image,
        # not the loose ranges in requirements.in (#206).
        run: pip-audit -r backend/websearch_service/requirements.txt

  python-bandit:
    name: Python static security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run bandit on backend service
        run: bandit -r backend/websearch_service/app -ll

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so pushes are scanned for secrets in every new commit,
          # not just the final tree state (#209).
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are reported redacted; never print secret values in logs.
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
