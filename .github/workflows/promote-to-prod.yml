name: Promote to Production

on:
  workflow_dispatch:

concurrency:
  group: promote-to-prod
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  promote:
    name: Open promotion PR staging → main
    runs-on: ubuntu-latest
    environment:
      # This must exactly match the GitHub Environment name. Railway's GitHub
      # integration auto-creates "<railway-project> / production" (not bare
      # "production") when it links the Railway production environment — a
      # bare-named environment does not exist and would otherwise be silently
      # auto-created here with zero protection rules on first run.
      name: "reliable-ambition / production"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a passing Release Verification run for staging HEAD
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Gate: promotion must not proceed unless "Release Verification"
            // (release-verification.yml) has actually passed for the exact
            // commit currently on `staging`. Previously the only check here
            // was "staging has new commits ahead of main" — an operator
            // could run this workflow and merge the resulting PR even if
            // staging's release verification had failed or never ran, since
            // nothing in this workflow queried it. release-verification.yml
            // already auto-runs after every "Deploy Staging" completion, so
            // in the normal flow a matching run always exists by the time
            // someone promotes.
            const { owner, repo } = context.repo;

            const { data: branch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'staging',
            });
            const stagingSha = branch.commit.sha;

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'release-verification.yml',
              branch: 'staging',
              status: 'completed',
              per_page: 20,
            });

            const matching = runs.workflow_runs.find((run) => run.head_sha === stagingSha);

            if (!matching) {
              core.setFailed(
                `No completed Release Verification run found for staging HEAD ${stagingSha}. ` +
                `Run "Release Verification" against staging (or wait for it to auto-run after ` +
                `"Deploy Staging") before promoting.`,
              );
              return;
            }

            if (matching.conclusion !== 'success') {
              core.setFailed(
                `Release Verification for staging HEAD ${stagingSha} did not pass ` +
                `(conclusion: ${matching.conclusion}). See ${matching.html_url}. Fix and re-verify ` +
                `before promoting.`,
              );
              return;
            }

            core.info(`Release Verification passed for staging HEAD ${stagingSha}: ${matching.html_url}`);

      - name: Create or update promotion PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Check if a promotion PR already exists
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:staging`,
              base: 'main',
            });

            if (pulls.length > 0) {
              const pr = pulls[0];
              core.info(`Promotion PR already open: #${pr.number} — ${pr.html_url}`);
              core.setOutput('pr_url', pr.html_url);
              return;
            }

            // Verify staging is ahead of main (fast-fail before opening a PR)
            try {
              const { data: compare } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: 'main...staging',
              });

              if (compare.ahead_by === 0) {
                core.setFailed('staging has no new commits ahead of main — nothing to promote.');
                return;
              }
            } catch (error) {
              core.setFailed(`Could not compare branches: ${error.message}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore: promote staging to production',
              head: 'staging',
              base: 'main',
              body: [
                '## Production promotion',
                '',
                'This PR was created automatically by the **Promote to Production** workflow.',
                '',
                'Merge this PR only after:',
                '- [ ] All required status checks pass',
                '- [ ] At least one reviewer has approved',
                '',
                '> Merging will trigger the production deploy workflow.',
              ].join('\n'),
            });

            core.info(`Promotion PR created: #${pr.number} — ${pr.html_url}`);
            core.setOutput('pr_url', pr.html_url);

      - name: Print PR URL
        run: echo "Promotion PR → ${{ steps.*.outputs.pr_url || 'see job log above' }}"
