name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ─── Frontend: Lint + Type Check + Test + Build ──────────────────────────
  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          # Skip optional dep postinstall (Railway CLI binary download, Vercel CLI)
          npm_config_ignore_scripts: true

      - name: Setup Python (for OpenAPI export)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/websearch_service/requirements.txt

      - name: Install backend deps (for OpenAPI export)
        # Install the hash-locked runtime requirements — export_openapi.py
        # imports app.main, which transitively pulls in numpy, redis,
        # sqlalchemy, etc. via the services layer (#206: committed lock,
        # hashes verified, no test tooling needed here).
        run: pip install --require-hashes -r backend/websearch_service/requirements.txt

      - name: OpenAPI drift detection
        run: |
          python backend/websearch_service/export_openapi.py
          npm run generate:api-types
          git diff --exit-code docs/openapi.json src/lib/generated/ || {
            echo "::error::OpenAPI spec or generated types are out of date. Run 'python backend/websearch_service/export_openapi.py && npm run generate:api-types' and commit the result."
            exit 1
          }

      - name: Run ESLint (zero warnings)
        run: npm run lint:ci

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PYTHON_API_URL: ${{ secrets.VITE_PYTHON_API_URL }}
          VITE_WEBSEARCH_API_URL: ${{ secrets.VITE_WEBSEARCH_API_URL }}

      - name: Enforce bundle-size budget (#213)
        run: npm run test:bundle-budget

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ─── Backend: Lint + Test ────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: advisor_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d advisor_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            backend/websearch_service/requirements.txt
            backend/websearch_service/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./backend/websearch_service
        # Runtime + test locks, both hash-verified (#206).
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Validate Alembic migrations
        working-directory: ./backend/websearch_service
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/advisor_ci
        # Only `upgrade head` is meaningful for this SQL-first repo. `alembic
        # check` runs autogen, which compares ORM metadata to the live DB —
        # since the migrations are bare SQL files (no ORM models), autogen
        # always reports the manually-created tables as "missing". Run upgrade
        # twice to confirm migrations are idempotent.
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini current

      - name: Run tests with coverage
        working-directory: ./backend/websearch_service
        # Coverage flags + threshold live in pytest.ini (single source of truth).
        # ALEMBIC_DATABASE_URL points at the migrated service DB so the
        # database-level constraint/oversell tests (#207) run instead of skipping.
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/advisor_ci
        run: pytest tests/ -v

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: ./backend/websearch_service/coverage.xml
          flags: backend
          name: backend-coverage

  # ─── Docker Build Test ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build backend Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend/websearch_service
          file: ./backend/websearch_service/Dockerfile
          push: false
          load: true
          tags: ai-financial-advisor-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Final-image smoke tests (#210) ────────────────────────────────────
      - name: Smoke test — production config validation fails fast
        # With ENVIRONMENT=production and no CORS_ORIGINS/TRUSTED_HOSTS the
        # container must refuse to start with an actionable FATAL message,
        # not serve traffic on unsafe defaults.
        run: |
          set +e
          # timeout bounds the step if fail-fast ever regresses into a hang.
          timeout 60 docker run --rm --name cfg-fail \
            -e ENVIRONMENT=production \
            -e SUPABASE_URL=https://smoke.supabase.co \
            -e SUPABASE_ANON_KEY=smoke-anon \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke-service \
            ai-financial-advisor-backend:test > /tmp/cfg-fail.log 2>&1
          status=$?
          set -e
          cat /tmp/cfg-fail.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Container started despite missing production configuration"
            exit 1
          fi
          grep -q "FATAL" /tmp/cfg-fail.log

      - name: Smoke test — container serves /health/live with valid config
        run: |
          docker run -d --rm --name backend-smoke -p 18000:8000 \
            -e ENVIRONMENT=test \
            -e SUPABASE_URL=https://smoke.supabase.co \
            -e SUPABASE_ANON_KEY=smoke-anon \
            -e SUPABASE_SERVICE_ROLE_KEY=smoke-service \
            -e SUPABASE_JWT_SECRET=smoke-placeholder-not-a-real-jwt-secret \
            -e OPENAI_API_KEY=smoke-openai \
            -e TAVILY_API_KEY=smoke-tavily \
            ai-financial-advisor-backend:test
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18000/health/live > /tmp/live.json 2>/dev/null; then
              cat /tmp/live.json
              docker stop backend-smoke
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health/live never became reachable"
          docker logs backend-smoke || true
          docker stop backend-smoke || true
          exit 1

