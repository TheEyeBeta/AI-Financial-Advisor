name: Run DB Migrations

# Manual-only, environment-gated Alembic migration runner. Never triggered
# by push/PR — this workflow writes DDL to a real staging or production
# database, so it only ever runs on an operator's explicit dispatch.
#
# Safety model (mirrors staging-seed.yml / promote-to-prod.yml, both already
# established in this repo):
#   - workflow_dispatch only, with an explicit environment choice — never
#     inferred from a branch or automatically triggered.
#   - Pinned to the `main` ref (job-level `if`): workflow_dispatch lets an
#     operator pick any branch/tag to run against, but this job must only
#     ever execute the migrations that are actually on `main` — dispatching
#     against a feature branch could otherwise apply unreviewed, unmerged
#     migrations to a real database (CodeRabbit, PR #294).
#   - The dispatch input ("staging"/"production") is mapped to the actual
#     GitHub Environment name below — this repo's staging Environment is
#     named "main-staging", not "staging", so the mapping keeps the
#     operator-facing dropdown readable while binding to the real
#     Environment. Any required reviewers/wait-timer configured on that
#     Environment (e.g. the "production" approval gate documented in
#     deployment/DEPLOYMENT.md) is enforced before the job starts, exactly
#     like promote-to-prod.yml.
#   - The database URL secret is selected via an explicit conditional
#     (same pattern as release-verification.yml's URL selection), not a
#     shared/implicit name — "staging" can only ever resolve
#     STAGING_DATABASE_URL, "production" can only ever resolve
#     PRODUCTION_DATABASE_URL — and is validated non-empty before any
#     Alembic step runs, so a missing/misconfigured secret fails closed
#     instead of letting Alembic attempt a connection with a blank URL
#     (CodeRabbit, PR #294).
#   - concurrency group is per-environment: two migration runs against the
#     same database can never race, but a staging run and a production run
#     don't block each other.
#   - Alembic is the sole migration authority (AGENTS.md) — this workflow
#     only ever calls `alembic upgrade head`, never applies raw sql/*.sql.
#
# Required secrets (configure on the matching GitHub Environment):
#   main-staging Environment: STAGING_DATABASE_URL
#   production Environment:   PRODUCTION_DATABASE_URL
# Both must be a direct Postgres connection string (not the Supabase REST
# URL) with migration privileges — see alembic/env.py's
# ALEMBIC_DATABASE_URL / DATABASE_URL / SUPABASE_DB_URL resolution order.

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Database to migrate"
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: run-db-migrations-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: alembic upgrade head (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    # Only ever run the migrations that are actually on main — see safety
    # model note above.
    if: github.ref == 'refs/heads/main'
    environment:
      # GitHub Environment names as auto-created by Railway's GitHub
      # integration: "reliable-ambition / main-staging" and
      # "reliable-ambition / production" (prefixed with the Railway project
      # name) — not bare "main-staging" / "production".
      name: ${{ inputs.target_environment == 'production' && 'reliable-ambition / production' || 'reliable-ambition / main-staging' }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate database URL is configured
        # Fails closed: a missing/misconfigured secret must stop the job
        # before Alembic ever attempts a connection with a blank URL. Only
        # validates presence here — deliberately does not persist the DSN to
        # $GITHUB_ENV, which would expose it to every later step (pip
        # install, etc.) rather than just the Alembic steps that need it,
        # and a bare KEY=value append breaks if the secret ever contains a
        # newline (CodeRabbit, PR #295). Each Alembic step below re-selects
        # the secret directly in its own env: block instead.
        env:
          ALEMBIC_DATABASE_URL: ${{ inputs.target_environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$ALEMBIC_DATABASE_URL" ]; then
            echo "No database URL secret configured for target '${{ inputs.target_environment }}' — refusing to run migrations." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend/websearch_service
        run: pip install -r requirements.txt

      - name: Record starting revision
        working-directory: backend/websearch_service
        env:
          ALEMBIC_DATABASE_URL: ${{ inputs.target_environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: |
          echo "Target: ${{ inputs.target_environment }}"
          alembic -c alembic.ini current

      - name: alembic upgrade head
        working-directory: backend/websearch_service
        env:
          ALEMBIC_DATABASE_URL: ${{ inputs.target_environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: alembic -c alembic.ini upgrade head

      - name: Confirm resulting revision
        working-directory: backend/websearch_service
        env:
          ALEMBIC_DATABASE_URL: ${{ inputs.target_environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: alembic -c alembic.ini current

      - name: alembic check (informational)
        working-directory: backend/websearch_service
        # continue-on-error: this repo has known, pre-existing drift between
        # `alembic check`'s autogenerate comparison and several public-schema
        # tables created via raw SQL before Alembic became authoritative
        # (see the rip-apart architecture audit, 2026-07-29) — it already
        # fails on `main` today, independent of any migration this workflow
        # runs. This step surfaces its output for visibility without
        # blocking a legitimate upgrade on a pre-existing, unrelated gap.
        continue-on-error: true
        env:
          ALEMBIC_DATABASE_URL: ${{ inputs.target_environment == 'production' && secrets.PRODUCTION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
        run: alembic -c alembic.ini check
