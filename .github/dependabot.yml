# Automated dependency-update PRs (#206). Each ecosystem gets a weekly,
# review-gated PR batch; nothing merges without CI and human review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # These are framework migrations, not safe automatic version bumps.
      # Revisit after the controlled beta in dedicated compatibility PRs.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend/websearch_service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Major cryptography releases require a deliberately regenerated,
      # reviewed hash lock because automatic generation has produced drift.
      - dependency-name: cryptography
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories:
      - /backend/websearch_service
      - /deployment
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The backend runtime and lockfiles are standardized on Python 3.12.
      - dependency-name: python
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
